# Validated by tempmodel.config.Settings.
api:
  url: https://archive-api.open-meteo.com/v1/archive
  # best_match is the API default. It reaches yesterday but changes underlying
  # model over time. era5 is one model throughout but is about a week behind.
  model: best_match
  variables:
    - temperature_2m_mean
    - temperature_2m_max
    - temperature_2m_min
  timeout_seconds: 120
  max_retries: 4
  # With 4 retries, waits of 0, 10, 20 and 40 s outlast the per-minute rate limit.
  retry_backoff_seconds: 5

location:
  name: London Heathrow
  latitude: 51.4700
  longitude: -0.4543
  timezone: Europe/London

period:
  years: 10  # ending yesterday

output:
  path: data/london_daily_temperature.csv  # relative to where you run from

model:
  column: temperature_2m_mean  # must be one of api.variables
  # The paper's choices: J1 = 1 for the mean, I2 = J2 = 4 for the variance.
  seasonal_harmonics: 1
  variance_harmonics: 4
  trend: true

forecast:
  n_days: 365
  level: 0.95  # probability covered by the interval
  n_samples: 1000
  seed: 0

backtest:
  min_years: 5  # history before the first forecast

plots:
  bins: 20  # a number, or a rule such as auto
  history_years: 10
  max_lag: 2000
  level: 0.95  # for the autocorrelation limits
  n_paths: 3  # sample paths drawn on the forecast
  recent_days: 180  # data drawn before the forecast

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
