[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tempmodel"
version = "0.1.0"
description = "Temperature model based on Benth et al."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "hydra-core>=1.3.2",
    "matplotlib>=3.10",
    "numpy>=2",
    "pandas>=2.2",
    "pydantic>=2.10",
    "requests>=2.32",
    "scipy>=1.14",
    "tzdata; sys_platform == 'win32'",
    "urllib3>=2",
]

[project.optional-dependencies]
dev = [
    "ipykernel",
    "mypy>=1.17",
    "nbclient",
    "pandas-stubs",
    "pytest>=8",
    "responses>=0.25",
    "ruff>=0.12",
    "scipy-stubs",
    "types-requests",
]

[project.scripts]
tempmodel-download = "tempmodel.data.download:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tempmodel.conf" = ["*.yaml"]

[tool.ruff]
line-length = 88
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
ignore = ["D107"]  # __init__ is documented in the class docstring
select = ["E", "F", "I", "B", "UP", "N", "D", "G", "PT", "RUF", "SIM"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
